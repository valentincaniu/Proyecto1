<!DOCTYPE html>
<html lang="es">
<head> <!-- Contiene información de configuración de la página. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sitio personal - Contacto</title>
    <link rel="stylesheet" href="estilos/css1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- Importa la biblioteca Font Awesome para poder utilizar íconos. -->
    <!-- Es una biblioteca de íconos lista para usar mediante clases CSS. -->
</head>

<body>

    <header> <!-- Encabezado principal del sitio. -->

        <h1>VALENTIN CAÑIU</h1> <!-- Título principal del sitio. -->

        <nav> <!-- Menú principal de navegación. -->

            <ul>

                <li>
                    <a href="index.html">Inicio</a> <!-- Enlace interno hacia la página principal. -->
                </li>

                <li>
                    <a href="intereses.html">Intereses</a> <!-- Enlace interno hacia la página de intereses. -->
                </li>

                <li>
                    Contacto <!-- Página actual. No tiene enlace porque el usuario ya está en ella. -->
                </li>

            </ul>

        </nav>

    </header>
    
<main> <!-- Contenido principal de la página. -->

    <section class="contacto"> <!-- Sección principal dedicada a la información de contacto. -->

        <h2>CONTACTAME</h2> <!-- Título de la sección. -->

        <div class="cards"> <!-- Contenedor que agrupa todas las tarjetas de contacto, El CSS probablemente utilice Flexbox o Grid para acomodarlas. -->
            
            <div class="card"> <!-- Primera tarjeta de contacto. -->
                <i class="fa-solid fa-envelope"></i> <!-- Ícono obtenido desde Font Awesome, <i> se utiliza para mostrar el ícono mediante clases CSS. -->
                <h3>Email</h3> <!-- Título de la tarjeta. -->
                <a href="mailto:tcaniucaba@uade.edu.ar">tcaniucaba@uade.edu.ar</a> <!-- mailto: abre automáticamente el cliente de correo del usuario. -->
            </div>

            <div class="card"> <!-- Segunda tarjeta. -->
                <i class="fa-solid fa-phone"></i> <!-- Ícono de teléfono. -->
                <h3>Teléfono</h3>
                <a href="tel:+5492944352015">+54 9 2944 352015</a> <!-- tel: permite iniciar una llamada desde dispositivos compatibles. -->
            </div>

            <div class="card"> <!-- Tercera tarjeta. -->
                <i class="fa-brands fa-linkedin"></i> <!-- Ícono de LinkedIn. -->
                <h3>LinkedIn</h3>
                <a href="https://www.linkedin.com/in/tiagovalentincañiucaba" target="_blank">Ver perfil</a> <!-- target="_blank" abre el perfil en una nueva pestaña. -->
            </div>

            <div class="card"> <!-- Cuarta tarjeta. -->
                <i class="fa-brands fa-instagram"></i> <!-- Ícono de Instagram. -->
                <h3>Instagram</h3>
                <a href="https://www.instagram.com/valentincaniu" target="_blank">@valentincaniu</a> <!-- Enlace externo hacia el perfil de Instagram. -->
            </div>

        </div>

    </section>

</main>
    
    <footer> <!-- Pie de página del sitio. -->
        
        <p>© 2026 Valentin Cañiu - Todos los derechos reservados</p> <!-- Información legal del sitio. -->
        
        <nav> <!-- Menú secundario ubicado en el footer. -->
            <ul>
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>

        <p>Seguime en: <!-- Enlaces externos hacia redes sociales. -->
            <a href="https://www.instagram.com/valentincaniu" target="_blank">Instagram</a> |
            <a href="https://www.linkedin.com/in/tiagovalentincañiucaba" target="_blank">LinkedIn</a>
        </p>

    </footer>

</body>
</html>
